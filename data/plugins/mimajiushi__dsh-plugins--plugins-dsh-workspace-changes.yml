url: https://github.com/mimajiushi/dsh-plugins/tree/main/plugins/dsh-workspace-changes
name: mimajiushi/dsh-plugins#dsh-workspace-changes
category: git
description:
  en: 'Adds an IDE-style Changes panel to the right sidebar: grouped working-tree changes, unified and side-by-side diff with line numbers, file navigation, copy-diff and open-in-IDE, read-only against the repository.'
  zh: '右侧栏的「变更」面板：分组变更树 + 完整 diff（统一/双栏切换、双列行号、文件导航、复制 diff、在 IDE 打开），对仓库只读。'
