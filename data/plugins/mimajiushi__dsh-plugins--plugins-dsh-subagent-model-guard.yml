name: mimajiushi/dsh-plugins#dsh-subagent-model-guard
category: security
description:
  en: 'Enforces the subagent-model-selection whitelist at every child-Agent creation, so subagent, AgentTeams and workflow children can only run on a provider and model that is on the list.'
  zh: '在创建子 Agent 的唯一入口强制白名单：subagent、AgentTeams、workflow 的子 Agent 只能跑在白名单内的模型上。'
