url: https://github.com/mimajiushi/dsh-plugins/tree/main/plugins/dsh-llm-retry-all
name: mimajiushi/dsh-plugins#dsh-llm-retry-all
category: model
description:
  en: 'Retries every model-gateway error — rate limit, quota, auth, network, empty response — on a linear 5s-step backoff capped at 5 minutes, covering both agent-loop requests and direct ctx.llm.stream calls such as compaction and session titles.'
  zh: '把模型网关的所有错误都纳入重试（线性 5 秒步进、封顶 5 分钟），既覆盖主对话请求，也覆盖 compact 与会话标题这类直连 ctx.llm.stream 的调用。'
